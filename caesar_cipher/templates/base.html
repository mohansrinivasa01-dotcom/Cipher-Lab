<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f2">
    <title>{% block title %}Caesar — Cryptography Studio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('game_page') }}" aria-label="Caesar home">
            <span class="brand-mark"><i></i><b></b></span><span>CAESAR</span>
        </a>
        <nav class="main-nav" aria-label="Primary navigation">
            <a class="nav-link {% if active_page == 'encryption' %}active{% endif %}" href="{{ url_for('encryption_page') }}">Encryption</a>
            <a class="nav-link {% if active_page == 'decryption' %}active{% endif %}" href="{{ url_for('decryption_page') }}">Decryption</a>
            <a class="nav-link {% if active_page == 'bruteforce' %}active{% endif %}" href="{{ url_for('bruteforce_page') }}">Brute force</a>
            <a class="nav-link {% if active_page == 'game' %}active{% endif %}" href="{{ url_for('game_page') }}">Play</a>
        </nav>
        <button class="menu-button" type="button" aria-label="Open navigation menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </header>
    <div class="mobile-menu" aria-hidden="true">
        <a class="{% if active_page == 'encryption' %}active{% endif %}" href="{{ url_for('encryption_page') }}">01 / Encryption</a>
        <a class="{% if active_page == 'decryption' %}active{% endif %}" href="{{ url_for('decryption_page') }}">02 / Decryption</a>
        <a class="{% if active_page == 'bruteforce' %}active{% endif %}" href="{{ url_for('bruteforce_page') }}">03 / Brute force</a>
        <a class="{% if active_page == 'game' %}active{% endif %}" href="{{ url_for('game_page') }}">04 / Play</a>
    </div>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">
        <div><span class="footer-mark">CAESAR<span>.</span></span><small>Learn the shift / master the code</small></div>
        <div class="footer-links"><a href="{{ url_for('encryption_page') }}">ENCRYPT</a><a href="{{ url_for('decryption_page') }}">DECRYPT</a><a href="{{ url_for('bruteforce_page') }}">ANALYZE</a><a href="{{ url_for('game_page') }}">PLAY</a></div>
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
